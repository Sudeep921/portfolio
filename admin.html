<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Portfolio Admin</title>

  <link rel="stylesheet" href="admin.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="container">

    <header>
      <h1>PORTFOLIO <span>ADMIN</span></h1>
      <a href="index.html">← View Portfolio</a>
    </header>

    <!-- LOGIN -->

    <section id="loginSection" class="panel">

      <h2>Admin Login</h2>

      <form id="loginForm">

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">LOGIN</button>

      </form>

      <p id="loginMessage"></p>

    </section>

    <!-- DASHBOARD -->

    <section id="dashboardSection" hidden>

      <div class="dashboard-header">
        <h2>Project Dashboard</h2>

        <button id="logoutBtn" class="logout">
          LOGOUT
        </button>
      </div>

      <div class="panel">

        <h2 id="formTitle">Add New Project</h2>

        <form id="projectForm">

          <input type="hidden" id="projectId">

          <label>Project Title</label>
          <input type="text" id="projectTitle" required>

          <label>Description</label>
          <textarea id="projectDescription" required></textarea>

          <label>Features (comma separated)</label>
          <textarea
            id="projectFeatures"
            placeholder="Responsive design, Authentication, Dashboard"
          ></textarea>

          <label>Technologies (comma separated)</label>
          <input
            type="text"
            id="projectTechnologies"
            placeholder="HTML, CSS, JavaScript"
          >

          <label>Project Photos (Multiple Photos)</label>

          <input
            type="file"
            id="projectImage"
            accept="image/*"
            multiple
          >

          <small>
            Select up to 10 photos at once. JPG, PNG, WEBP supported.
          </small>

          <!-- SELECTED PHOTO PREVIEW -->

          <div id="photoPreview" class="photo-preview"></div>

          <!-- EXISTING PHOTOS -->

          <div id="existingPhotos" class="photo-preview"></div>

          <label>GitHub URL</label>
          <input
            type="url"
            id="githubUrl"
            placeholder="https://github.com/..."
          >

          <label>Live Demo URL</label>
          <input
            type="url"
            id="liveUrl"
            placeholder="https://..."
          >

          <button type="submit" id="saveBtn">
            SAVE PROJECT
          </button>

          <button
            type="button"
            id="cancelEditBtn"
            class="cancel"
            hidden
          >
            CANCEL EDIT
          </button>

        </form>

        <p id="formMessage"></p>

      </div>

      <div class="panel">

        <h2>All Projects</h2>

        <div id="adminProjects">
          Loading...
        </div>

      </div>

    </section>

  </div>

  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>

</body>
</html>
